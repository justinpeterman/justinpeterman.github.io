[tools]
node = "22.12.0"
pnpm = "10.33.2"

[tasks.install]
description = "Install locked project dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Start the Astro development server"
run = "pnpm run dev"

[tasks.build]
description = "Build the static site"
run = "pnpm run build"

[tasks.preview]
description = "Preview the production build"
run = "pnpm run preview"

[tasks.test]
description = "Run the workbench tests"
run = "pnpm test"
